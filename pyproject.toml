[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coral"
version = "0.1.0"
description = "Living collective learning system — capture (P→I→C), verify (market + reality anchor), promote (calcification)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "wilcoco" }]
keywords = ["ontology", "continual-learning", "knowledge-market", "plasticity"]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "anthropic>=0.40",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=7.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
